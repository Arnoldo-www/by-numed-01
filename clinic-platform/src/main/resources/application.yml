spring:
  application:
    name: clinic-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinic_platform}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:clinic}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:changeme-please-use-a-long-random-secret-in-production}
    expiration-hours: 8
